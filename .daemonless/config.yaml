# dbuild configuration file
# Full reference: https://github.com/daemonless/dbuild

build:
  architectures:
    - amd64
    - aarch64
  variants:
    # Release tag resolved from UPSTREAM_URL; nightly overrides it to `tip`.
    - tag: latest
      containerfile: Containerfile
      default: true
      tag_desc: "Latest tagged release of Sylve (AlchemillaHQ/Sylve)."
    - tag: nightly
      containerfile: Containerfile
      args:
        UPSTREAM_URL: "https://api.github.com/repos/AlchemillaHQ/Sylve/releases/tags/tip"
      tag_desc: "Rolling build from upstream's `tip` release (AlchemillaHQ/Sylve)."

cit:
  mode: health
  port: 8181
  health: /
  ready: "Sylve"
  puid: false
