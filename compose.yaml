name: sylve

x-daemonless:
  title: "Sylve"
  icon: ":simple-freebsd:"
  category: "Infrastructure"
  description: "Modern, open-source management platform for FreeBSD managing Virtual Machines (Bhyve), Jails, and ZFS storage."
  upstream_url: "https://github.com/AlchemillaHQ/Sylve"
  web_url: "https://sylve.io"
  freshports_url: "https://www.freshports.org/sysutils/sylve/"
  user: "root"
  mlock: false
  community: "Discord:https://chat.sylve.io"

  appjail:
    director:
      options:
        - alias:
        - ip4_inherit:
      services:
        sylve:
          name: sylve
          options:
            - from: ghcr.io/daemonless/sylve:nightly
            - template: "!ENV '${PWD}/sylve-template.conf'"
            - label: 'load-kld:1'
            - label: 'load-kld.load-vmm:vmm'
            - label: 'load-kld.load-if-bridge:if_bridge'
            - label: 'load-kld.load-cryptodev:cryptodev'
            - label: 'load-kld.load-if-epair:if_epair'
            - label: 'load-kld.load-nullfs:nullfs'
            - label: 'load-kld.load-netlink:netlink'
            - label: 'load-kld.load-nlsysevent:nlsysevent'
            - label: 'load-kld.load-nmdm:nmdm'
            - label: 'load-kld.load-pf:pf'
            - label: 'load-kld.load-pflog:pflog'
            - label: 'load-kld.load-if-wg:if_wg'
            - label: 'load-kld.load-linux:linux'
            - label: 'load-kld.load-linux.module:linuxelf'
            - label: 'load-kld.load-linux64:linux64'
            - label: 'load-kld.load-linux64.module:linux64elf'
            - label: 'load-kld.load-pty:pty'
            - label: 'load-kld.load-linprocfs:linprocfs'
            - label: 'load-kld.load-linsysfs:linsysfs'
            - label: 'load-kld.load-ctl:ctl'
            - device: 'include $devfsrules_hide_all'
            - device: 'include $devfsrules_unhide_basic'
            - device: 'include $devfsrules_unhide_login'
            - device: 'include $devfsrules_jail'
            - device: 'include $devfsrules_jail_vnet'
            - device: 'path zfs unhide'
            - device: 'path shm unhide'
            - device: 'path pf unhide'
            - device: 'path pflog unhide'
            - device: "path 'bpf\\*' unhide"
            - device: 'path vmm unhide'
            - device: "path 'vmm/\\*' unhide"
            - device: 'path vmm.io unhide'
            - device: "path 'vmm.io/\\*' unhide"
            - device: 'path vmmctl unhide'
            - device: "path 'nmdm\\*' unhide"
            - device: "path 'tap\\*' unhide"
            - device: 'path cam unhide'
            - device: "path 'cam/ctl' unhide"
            - device: "path 'da\\*' unhide"
            - device: "path 'ada\\*' unhide"
            - device: "path 'nda\\*' unhide"
            - device: "path 'pass\\*' unhide"
            - device: "path 'xpt\\*' unhide"
            - device: "path 'nvme\\*' unhide"
          volumes:
            - sylve-data: /var/db/sylve
      volumes:
        sylve-data:
          device: "!ENV '${SYLVE_DATA_LOCATION}'"

  docs:
    manual: true
    env:
      SYLVE_HOSTNAME: "Hostname/FQDN you reach Sylve at (node-identity check)"
      SYLVE_DATASET: "ZFS dataset delegated to Sylve (must match host-setup)"
      SYLVE_DATA_LOCATION: "Host path where Sylve stores its data"
      TZ: "Timezone for the container"
    volumes:
      /var/db/sylve: "Sylve database and runtime configuration"
    ports:
      8181: "Web Interface (HTTPS)"

services:
  sylve:
    image: ghcr.io/daemonless/sylve:nightly
    container_name: sylve
    hostname: ${SYLVE_HOSTNAME}
    restart: always
    network_mode: host

    annotations:
      org.freebsd.jail.name: "sylve"
      org.freebsd.jail.devfs_ruleset: "10"
      io.daemonless.sylve.autowire: "true"
      io.daemonless.sylve.dataset: "${SYLVE_DATASET}"
      org.freebsd.jail.allow.vmm: "true"
      org.freebsd.jail.allow.mount: "true"
      org.freebsd.jail.allow.mount.zfs: "true"
      org.freebsd.jail.allow.mount.fdescfs: "true"
      org.freebsd.jail.allow.nfsd: "true"
      org.freebsd.jail.children.max: "100"
      org.freebsd.jail.enforce_statfs: "1"
      org.freebsd.jail.allow.raw_sockets: "true"
      org.freebsd.jail.allow.chflags: "true"
      org.freebsd.jail.allow.routing: "true"
      org.freebsd.jail.allow.mount.linprocfs: "true"
      org.freebsd.jail.allow.mount.linsysfs: "true"
      org.freebsd.jail.allow.mount.tmpfs: "true"
      org.freebsd.jail.allow.mount.devfs: "true"
      org.freebsd.jail.allow.unprivileged_proc_debug: "true"

    env_file:
      - .env

    volumes:
      - ${SYLVE_DATA_LOCATION}:/var/db/sylve

